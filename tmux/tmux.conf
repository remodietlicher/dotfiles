# ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────────────────────
# Prefix: Ctrl-Space (instead of Ctrl-b)
# ─────────────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────
set -g mouse on                       # mouse: select panes, resize, scroll
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1             # panes start at 1
set -g renumber-windows on            # renumber when a window is closed
set -g history-limit 50000            # bigger scrollback
set -sg escape-time 10                # faster key response (good for nvim)
set -g focus-events on                # let nvim know when tmux gains focus
set -g set-clipboard on               # integrate with system clipboard
set -g detach-on-destroy off          # stay attached when a session closes

# ─────────────────────────────────────────────────────────────────────────────
# Colors / terminal — true color for nvim inside tmux
# ─────────────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # enable RGB / truecolor
set -ga terminal-overrides ",xterm-256color:Tc"

# ─────────────────────────────────────────────────────────────────────────────
# Reload config
# ─────────────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ─────────────────────────────────────────────────────────────────────────────
# Splits — intuitive | and -, open in the current pane's path
# ─────────────────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────────────────────
# Pane navigation / resizing
#   Ctrl-h/j/k/l is handled by vim-tmux-navigator (see below) — smart-aware.
# ─────────────────────────────────────────────────────────────────────────────
# Resize with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────────────────────────────────────────
# Copy mode — vi keys
# ─────────────────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ─────────────────────────────────────────────────────────────────────────────
# Plugins (TPM) — install with prefix + I after first launch
# ─────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across nvim+tmux
set -g @plugin 'catppuccin/tmux'                  # theme
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save sessions

# catppuccin
set -g @catppuccin_flavour 'mocha'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM — keep this line at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
