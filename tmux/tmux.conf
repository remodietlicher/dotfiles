# ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────────────────────
# Prefix: Ctrl-Space (instead of Ctrl-b)
# ─────────────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────
set -g mouse on                       # mouse: select panes, resize, scroll
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1             # panes start at 1
set -g renumber-windows on            # renumber when a window is closed
set -g history-limit 50000            # bigger scrollback
set -sg escape-time 10                # faster key response (good for nvim)
set -g focus-events on                # let nvim know when tmux gains focus
set -g set-clipboard on               # integrate with system clipboard
set -g detach-on-destroy off          # stay attached when a session closes

# ─────────────────────────────────────────────────────────────────────────────
# Colors / terminal — true color for nvim inside tmux
# ─────────────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # enable RGB / truecolor
set -ga terminal-overrides ",xterm-256color:Tc"

# ─────────────────────────────────────────────────────────────────────────────
# Reload config
# ─────────────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ─────────────────────────────────────────────────────────────────────────────
# Splits — intuitive | and -, open in the current pane's path
# ─────────────────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────────────────────
# Pane navigation / resizing
#   Ctrl-h/j/k/l is handled by vim-tmux-navigator (see below) — smart-aware.
# ─────────────────────────────────────────────────────────────────────────────
# Resize with prefix + H/J/K/L (repeatable: prefix once, then tap H/J/K/L).
# repeat-time widens the window for those repeat taps (default is a tight 500ms).
set -g repeat-time 1000
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────────────────────────────────────────
# Floating terminal — prefix + g toggles a popup scratch terminal.
#   It attaches a persistent "scratch" session, so its state (running process,
#   shell history, cwd) survives between opens. Pressing prefix + g again from
#   inside it detaches, which closes the popup.
# ─────────────────────────────────────────────────────────────────────────────
bind g if-shell -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s scratch"'

# ─────────────────────────────────────────────────────────────────────────────
# Copy mode — vi keys
# ─────────────────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Option/Alt + j/k scroll down / up while in copy mode (aligned with motion:
# j = down, k = up) — matches the nvim scroll maps. The left Option key is the
# Alt/Meta modifier (see ghostty config), so these arrive as M-j / M-k.
bind -T copy-mode-vi M-j send -X -N 5 scroll-down
bind -T copy-mode-vi M-k send -X -N 5 scroll-up

# ─────────────────────────────────────────────────────────────────────────────
# Plugins (TPM) — install with prefix + I after first launch
# ─────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across nvim+tmux
set -g @plugin 'catppuccin/tmux'                  # theme
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save sessions

# catppuccin
set -g @catppuccin_flavour 'mocha'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM — keep this line at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────────────────────────────────────
# Pane borders — set AFTER tpm so these win over catppuccin's muted defaults,
# which are hard to see on the dark Mocha background.
#   - heavy lines make the divider thicker
#   - inactive border is a visible grey, active border is bright blue so the
#     focused pane is obvious at a glance
# ─────────────────────────────────────────────────────────────────────────────
# Lean on the borders alone (no pane dimming): keep the inactive border dark and
# muted so it recedes, and make the active border bright + heavy so the focused
# pane's outline pops. pane-border-indicators adds arrow markers along the active
# border as an extra, non-intrusive focus cue.
set -g pane-border-lines double
set -g pane-border-style "fg=#45475a"             # surface1 — dark, recedes
set -g pane-active-border-style "fg=#fab387,bold" # peach — bright, highlights active
set -g pane-border-indicators arrows                # colour + arrows toward active pane
